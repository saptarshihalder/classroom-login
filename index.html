<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef1ef">
  <meta name="description" content="A shared read-only PDE course stream.">
  <title>PDE board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="mark" href="./" aria-label="PDE board">∂</a>
      <nav class="nav" aria-label="Course sections">
        <button class="navbtn on" data-tab="all" aria-label="Stream"><span>⌁</span><small>stream</small></button>
        <button class="navbtn" data-tab="post" aria-label="Announcements"><span>◌</span><small>updates</small></button>
        <button class="navbtn" data-tab="file" aria-label="Materials"><span>□</span><small>material</small></button>
      </nav>
      <div class="railfoot" id="short">PDE</div>
    </aside>

    <main class="page">
      <header class="top">
        <div>
          <div class="crumb">shared course board <span>·</span> read only</div>
          <h1 id="courseName">Partial Differential Equations</h1>
        </div>
        <button id="rf" class="refresh" type="button">refresh</button>
      </header>

      <section class="hero">
        <div class="herohead">
          <div>
            <span class="tag">course stream</span>
            <h2>Classroom, minus the clutter.</h2>
          </div>
          <div class="syn"><i id="dot"></i><span id="sync">not synced yet</span></div>
        </div>
        <p id="about">Announcements and shared course material in one place, ordered exactly like a class stream.</p>
        <div class="chalk" aria-hidden="true">∂u/∂t = α∇²u</div>
      </section>

      <section class="tools">
        <div class="tabs" role="tablist" aria-label="Filter posts">
          <button class="tab on" data-tab="all" role="tab">all</button>
          <button class="tab" data-tab="post" role="tab">announcements</button>
          <button class="tab" data-tab="file" role="tab">materials</button>
        </div>
        <label class="search">
          <span>⌕</span>
          <input id="find" type="search" placeholder="search this course" autocomplete="off">
        </label>
      </section>

      <section id="list" class="feed" aria-live="polite">
        <div class="loading"><div></div><div></div><div></div></div>
      </section>

      <footer>
        <span>public mirror</span>
        <span id="count">0 posts</span>
      </footer>
    </main>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
