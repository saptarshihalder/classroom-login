name: workspace
on:
  workflow_dispatch:
    inputs:
      create_state:
        description: Create the state store and file bucket instead of deploying. Run this once, first.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: create the state store and file bucket
        if: inputs.create_state
        env:
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          printf 'name = "course-boards"\nmain = "src/index.js"\ncompatibility_date = "2026-08-20"\n' > wrangler.toml
          npx wrangler r2 bucket create "${BUCKET:-course-board-files}" 2>&1 | grep -v 'already exists' || true
          npx wrangler kv namespace create STATE
          echo "Put the id printed above into the KV_NAMESPACE_ID repository variable, then run this workflow again with the box left unticked."

      - name: settings
        if: ${{ !inputs.create_state }}
        env:
          KV_ID: ${{ vars.KV_NAMESPACE_ID }}
          SITE: ${{ vars.SITE_URL }}
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          test -n "$KV_ID" || { echo "KV_NAMESPACE_ID is not set. Run this workflow once with the create box ticked."; exit 1; }
          sed -e "s|replace-with-kv-id|$KV_ID|" wrangler.toml.example > wrangler.toml
          [ -n "$SITE" ] && sed -i "s|^SITE_URL = .*|SITE_URL = \"$SITE\"|" wrangler.toml
          [ -n "$BUCKET" ] && sed -i "s|^bucket_name = .*|bucket_name = \"$BUCKET\"|" wrangler.toml
          grep -v '^#' wrangler.toml

      - name: deploy
        if: ${{ !inputs.create_state }}
        run: npx wrangler deploy

      - name: store the credentials
        if: ${{ !inputs.create_state }}
        env:
          ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for pair in "GOOGLE_CLIENT_ID:ID" "GOOGLE_CLIENT_SECRET:SECRET"; do
            name=${pair%%:*}
            from=${pair##*:}
            value=$(printenv "$from" || true)
            if [ -z "$value" ]; then echo "::error::repository secret for $name is empty"; exit 1; fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
          echo "Deployed. Add the worker's /oauth address to the Google OAuth client, and put the worker address in the api field of data/site.json."
