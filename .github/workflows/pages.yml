name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  ship:
    environment:
      name: github-pages
      url: ${{ steps.go.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: site contents
        run: node tools/verify.mjs
      - name: assemble
        run: |
          mkdir -p _site
          cp index.html board.html login.html privacy.html _site/
          cp directory.js board.js login.js styles.css icon.svg manifest.webmanifest _site/
          cp -r data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: go
        uses: actions/deploy-pages@v4
