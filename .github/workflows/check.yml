name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check worker/src/index.js
      - run: node -e "JSON.parse(require('fs').readFileSync('data/feed.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - run: test -f index.html && test -f styles.css && test -f app.js && test -f worker/wrangler.toml.example
      - run: '! grep -RIE "AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|GOCSPX-[0-9A-Za-z_-]{20,}" --exclude-dir=.git .'
