name: check
on:
  push:
  pull_request:
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax
        run: |
          for file in directory.js board.js login.js worker/src/*.js; do
            node --check "$file"
          done
      - name: site contents
        run: node tools/verify.mjs
      - name: worker tests
        run: npm test
        working-directory: worker
      - name: no credentials committed
        run: '! grep -RIE "AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|GOCSPX-[0-9A-Za-z_-]{20,}" --exclude-dir=.git .'
